# Reference Blueprint only. This file is services/points-indexer/render.yaml, not
# repo-root render.yaml, so a merge does not register a Render Blueprint and does
# not create a service. Do not apply this file. Nothing here is deployed.
#
# The process polls Base Sepolia (chain id 84532) and serves GET /health on
# 0.0.0.0:$PORT. This reference file does not add a disk. POINTS_DB_PATH is the
# sqlite file: point it at a persistent location when the host has one. The
# value below stays under /tmp, so that file is lost on restart or spin-down.
# Free web services spin down after about 15 minutes idle.
#
# BASE_SEPOLIA_RPC_URL is a URL that may carry a key. It is dashboard-only
# (sync: false) and has no value in this file. No signing key is read.
#
# A live echo check is required before POINTS_ENABLED is set, and again
# before POINTS_TRUSTED_PROXY_HOPS is raised. Run it from an IPv4 client
# and from an IPv6 client. Forge X-Forwarded-For, CF-Connecting-IP, and
# True-Client-IP. Echo the socket address, record the result, and remove
# the echo afterwards. The hop value below is 0 until that check sets it.
# The check needs two real client addresses each seen correctly, forged
# forwarded values ignored, and the chosen address outside a Cloudflare range.
# POINTS_CLOUDFLARE_INGRESS is not set. That flag must stay off for an
# origin that is reachable without Cloudflare.
#
# The image is built from the repository root so the notice file is copied
# from config/reputation/sepolia.json:
#   docker build -f services/points-indexer/Dockerfile .
# Render resolves dockerfilePath from the repo root when rootDir is unset
# (https://render.com/docs/blueprint-spec). This service does not set rootDir.

services:
  - type: web
    name: points-indexer
    runtime: docker
    dockerfilePath: ./services/points-indexer/Dockerfile
    dockerContext: .
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: CHAIN_ID
        value: "84532"
      - key: ESCROW_ADDRESS
        value: "0x3d660502D75f1e97b08c110255921b437A3C4C42"
      - key: POINTS_DB_PATH
        # Sqlite file. Point this at a persistent path when one is available.
        value: /tmp/points-indexer/ledger.sqlite
      - key: POINTS_POLL_MS
        value: "15000"
      - key: POINTS_LOG_RANGE
        value: "200"
      - key: POINTS_MAX_WINDOWS_PER_PASS
        value: "500"
      - key: POINTS_TRUSTED_PROXY_HOPS
        # 0 until a live echo check sets it. That check is required before POINTS_ENABLED, and again before this is raised.
        value: "0"
      - key: BASE_SEPOLIA_RPC_URL
        sync: false
