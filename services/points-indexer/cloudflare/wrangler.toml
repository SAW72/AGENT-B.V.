# Agent-B.V. points Worker. Placeholders only.
# Spencer deploys this himself. Nothing in this file is an account id,
# a secret, or an RPC URL.
#
# BASE_SEPOLIA_RPC_URL is intentionally absent. A plain var is wiped by
# the next `wrangler deploy`. Spencer sets it only with
# `npx wrangler secret put BASE_SEPOLIA_RPC_URL`. Never put the URL in
# this file or the repo.
# POINTS_ENABLED is intentionally absent. Leave it unset until the
# Verifier gives GO. Only the exact string true turns the indexer on.
# While it is unset, /v1/points/* returns 503 and /health does not
# touch the Durable Object.

"$schema" = "./node_modules/wrangler/config-schema.json"
name = "agent-bv-points"
main = "src/index.ts"
# Newest date this pinned Wrangler workerd binary accepts (4.124.0).
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0

[observability.traces]
enabled = false
head_sampling_rate = 0

[vars]
CHAIN_ID = "84532"
POINTS_LOG_RANGE = "200"
POINTS_MAX_WINDOWS_PER_RUN = "40"
POINTS_POLL_MS = "15000"
POINTS_CORS_ORIGINS = ""
POINTS_READ_RATE_PER_MINUTE = "60"
# Empty here. Test runs set it to 1 so sleeps do not wait on the wall clock.
POINTS_FAST_PACE = ""

[[durable_objects.bindings]]
name = "POINTS"
class_name = "PointsObject"

# Front Worker limit. /health and OPTIONS do not call this binding.
# namespace_id is a placeholder Spencer's deploy creates. It is not a secret.
[[ratelimits]]
name = "POINTS_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 60
period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PointsObject"]
