name: Secrets

on:
  # Required on every pull request to main. The gitleaks job name is the ruleset context.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Pinned gitleaks 8.30.1 binary. The published sha256 is split into two
# 32-hex halves so this file has no 64-hex literal. Together they are the
# linux_x64 digest from gitleaks_8.30.1_checksums.txt.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          ver=8.30.1
          sha_a=551f6fc83ea457d62a0d98237cbad105
          sha_b=af8d557003051f41f3e7ca7b3f2470eb
          sha="${sha_a}${sha_b}"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "$url"
          echo "${sha}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan PR commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GITLEAKS="$RUNNER_TEMP/gitleaks"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_SHA"
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
            HEAD_SHA="$(git rev-parse FETCH_HEAD)"
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            count="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
            if [ "$count" -lt 1 ]; then
              echo "PR range ${BASE_SHA}..${HEAD_SHA} has no commits"
              exit 1
            fi
            LOG_OPTS="--no-merges ${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "${BEFORE}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              LOG_OPTS="-1"
            else
              LOG_OPTS="--no-merges ${BEFORE}..${PUSH_SHA}"
            fi
          else
            LOG_OPTS="-1"
          fi
          echo "gitleaks log-opts: ${LOG_OPTS}"
          "$GITLEAKS" detect --redact --no-banner --exit-code 1 --log-opts="${LOG_OPTS}"
