# Manual Cloudflare Pages upload for the wallet UX.
# Actions → Deploy wallet-ux → Run workflow, on main.
# workflow_dispatch only: a push or pull request does not publish.
# Node.js 22 matches apps/wallet-ux/.node-version and the wallet-ux job in ci.yml.
# There is no .nvmrc and package.json has no engines field.
# The claim API secret is retired. This workflow has no input that can embed it.
# A non-main ref skips this job. The first step fails the job if a run still starts.

name: Deploy wallet-ux

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-wallet-ux
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: apps/wallet-ux
    env:
      LIVE_ESCROW: "0x3d660502D75f1e97b08c110255921b437A3C4C42"
      PHRASE_SUBMITTING: "Submitting through the claim relayer"
      PHRASE_WALLET_CHOICE: "Submit through the claim relayer, or from your wallet."
    steps:
      - name: Require dispatch from main
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Deploy wallet-ux only publishes from refs/heads/main. This run is ${GITHUB_REF}."
            exit 1
          fi
          echo "github.ref is refs/heads/main."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/wallet-ux/package-lock.json

      - name: Require Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_CLAIM_RELAYER_URL: ${{ vars.VITE_CLAIM_RELAYER_URL }}
        run: |
          missing=0
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is set."
          else
            echo "CLOUDFLARE_API_TOKEN is empty. Store it as a secret on the production GitHub environment only, never as a repository secret. Use the Pages:Edit scope only. Spencer: delete any existing repository-level copy before running Deploy wallet-ux."
            missing=1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is set."
          else
            echo "CLOUDFLARE_ACCOUNT_ID is empty. Store it as a secret on the production GitHub environment only, never as a repository secret. Spencer: delete any existing repository-level copy before running Deploy wallet-ux."
            missing=1
          fi
          relayer_url=$(printf '%s' "$VITE_CLAIM_RELAYER_URL" | tr -d '\r\n')
          relayer_url="${relayer_url#"${relayer_url%%[![:space:]]*}"}"
          relayer_url="${relayer_url%"${relayer_url##*[![:space:]]}"}"
          if [ -z "$relayer_url" ]; then
            echo "VITE_CLAIM_RELAYER_URL is empty. Set the production environment variable VITE_CLAIM_RELAYER_URL to an https:// URL. It is a production environment variable, never a repository variable. Spencer: delete any existing repository-level copy."
            missing=1
          elif [ "${relayer_url#https://}" = "$relayer_url" ]; then
            echo "VITE_CLAIM_RELAYER_URL does not start with https://. Set the production environment variable VITE_CLAIM_RELAYER_URL to an https:// URL. It is a production environment variable, never a repository variable."
            missing=1
          else
            echo "VITE_CLAIM_RELAYER_URL is set on the production environment and starts with https://."
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_CLAIM_RELAYER_URL: ${{ vars.VITE_CLAIM_RELAYER_URL }}

      - name: Guard escrow addresses in the built bundle
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/guard-escrow-addresses.mjs dist

      - name: Reject retired claim-secret markers
        run: node scripts/guard-claim-secret.mjs dist

      # defaults.run.working-directory does not apply to uses steps.
      # cloudflare/wrangler-action v4.1.3 installs Wrangler 4 by default.
      # gitHubToken is omitted, so the action does not create a GitHub deployment.
      # Direct Upload has no promote: the production step uploads this same dist again.
      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/wallet-ux
          command: pages deploy dist --project-name=agent-a-wallet-ux --branch=preview-${{ github.run_id }} --commit-hash=${{ github.sha }} --commit-dirty=false

      - name: Verify the preview bundle
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
        run: node scripts/verify-served-bundle.mjs

      - name: Deploy production
        id: production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/wallet-ux
          command: pages deploy dist --project-name=agent-a-wallet-ux --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

      - name: Verify the production bundle
        env:
          DEPLOYMENT_URL: ${{ steps.production.outputs.deployment-url }}
        run: node scripts/verify-served-bundle.mjs

      # preview-<run id> has a single deployment, so it is the latest on that
      # branch. Cloudflare refuses to delete the latest deployment on a branch.
      # continue-on-error keeps that refusal from failing a production deploy
      # that already succeeded. The step still runs after a later failure.
      - name: Delete the preview deployment
        if: ${{ always() && steps.preview.outputs.pages-deployment-id != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/wallet-ux
          command: pages deployment delete ${{ steps.preview.outputs.pages-deployment-id }} --project-name=agent-a-wallet-ux --force
