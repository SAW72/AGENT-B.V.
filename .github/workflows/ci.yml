name: CI

on:
  push:
    branches: [main]
  pull_request:

# Coverage artifacts need actions: write. Tests only read the repo.
permissions:
  contents: read
  actions: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Unit / smoke tests (Grok is mocked; no API key)
        # Same pytest selection as before, plus a coverage report. No fail-under gate.
        run: |
          mkdir -p coverage/python
          pytest --cov --cov-report=term-missing --cov-report=html --cov-report=xml --cov-report=json --cov-report=lcov
      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage/python/
          if-no-files-found: error
      - name: Stub audit path
        run: ./pipeline/run_audit.sh

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check operator guard in bash and zsh
        run: bash script/check-ops-guard.sh && zsh script/check-ops-guard.sh
      # Main's forge-std install plus OpenZeppelin (BVT ERC-20).
      # Submodules are vendored; install is a fallback if checkout skips them.
      - name: Install forge-std
        run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-commit
      - name: Build
        run: forge build
      - name: Wallet-ux escrow ABI matches forge artifact
        run: |
          ./scripts/gen-escrow-abi.sh
          if ! git diff --exit-code -- apps/wallet-ux/src/abi/BotAttestationEscrow.json; then
            echo "::error::apps/wallet-ux/src/abi/BotAttestationEscrow.json drifted from the forge artifact for contracts/BotAttestationEscrow.sol:BotAttestationEscrow. Regenerate and commit it with: forge build && ./scripts/gen-escrow-abi.sh"
            exit 1
          fi
      - name: Test
        env:
          MIGRATE_ESCROWS: "0"
        run: forge test
      - name: Coverage
        # forge test above is unchanged. Coverage runs the suite again and fails if a test fails.
        env:
          MIGRATE_ESCROWS: "0"
        run: |
          mkdir -p coverage/contracts out
          forge coverage --report summary --report lcov --exclude-tests --report-file coverage/contracts/lcov.info
      - name: Upload contract coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-contracts
          path: coverage/contracts/
          if-no-files-found: error

  claim-relayer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install claim relayer deps
        working-directory: claim-relayer
        run: npm ci
      - name: Claim relayer unit tests (no network)
        # Same test/*.test.mjs files as npm test, with the built-in Node coverage report.
        working-directory: claim-relayer
        run: npm run test:coverage
      - name: Upload claim-relayer coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-claim-relayer
          path: claim-relayer/coverage/
          if-no-files-found: error

  # Public Base Sepolia fork of LiveDenylistVaultTest. continue-on-error so an RPC
  # failure cannot fail the required CI checks. No keys, no broadcast.
  fork-test-base-sepolia:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-commit
      - name: Live Denylist and Vault fork test (public Base Sepolia)
        env:
          MIGRATE_ESCROWS: "0"
        run: forge test --fork-url https://sepolia.base.org --match-contract LiveDenylistVaultTest -vv

  wallet-ux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wallet-ux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/wallet-ux/package-lock.json
      - name: Install
        run: npm ci
      - name: Install claim relayer deps
        # The cross-package domain test loads claim-relayer as Node modules.
        working-directory: claim-relayer
        run: npm ci
      - name: Install Chrome for the footer layout test
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
      - name: Test
        # Includes src/**/*.test.ts and scripts/**/*.test.mjs (deploy guard scripts).
        # test:coverage is vitest run --coverage: same files, plus the coverage report.
        run: npm run test:coverage
      - name: Upload wallet-ux coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-wallet-ux
          path: apps/wallet-ux/coverage/
          if-no-files-found: error
      - name: Build
        run: npm run build
      - name: Reject retired claim-secret markers
        # apps/wallet-ux via defaults.run.working-directory. A leak fails the pull request.
        # A clean scan logs "Claim leak scan passed".
        run: node scripts/guard-claim-secret.mjs dist
      - name: Reject non-ASCII dashes in the claim domain name
        # Source domain-name lines, claimIntent files, and the built dist.
        run: node scripts/guard-domain-dashes.mjs
