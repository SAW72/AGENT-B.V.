name: Tester sign-up
description: Volunteer to test. No payment, token or value is promised.
title: "[Tester] Sign-up"
body:
  - type: markdown
    attributes:
      value: |
        **PENDING LAWYER REVIEW**

        Do not post your email, wallet address or any key here. GitHub issues are public. We will reply in this issue with a link to a private form for contact details. Official contact: agent-bv@stewardoftheking.com.

        Nothing here is an offer of tokens, value or any investment.

        Testing is optional and at your own risk. Use only free testnet tokens. They have no value. Do not connect a wallet that holds real funds. We do not ask you to deposit funds. Testers can earn points for testing. Points have no cash or monetary value, are not transferable, cannot be sold or exchanged, and are not tokens, securities or a promise of any future token, payment, or other distribution. Points are not earned by depositing funds or by the amount of funds used. We may change or end the points program at any time.

        Points are per task or per bug reported, never per amount or volume.

        There are no leaderboards, ranks or prizes.

        Eligibility is subject to terms, jurisdiction restrictions, and sanctions screening.

        Testnet only (chain 84532). Test ETH and any testnet tokens have no monetary value, cannot be redeemed or exchanged for anything of value, and will not convert into any future token. Contracts may be redeployed.

        We only use this to contact you about testing. Never share private keys or seed phrases.

        This sign-up collects only your GitHub handle. You are the issue author. Do not add an email, a wallet address, or any other personal field.

        Tester Terms (DRAFT): https://agent-bv.pages.dev/legal/tester-terms/
        Privacy Notice (DRAFT): https://agent-bv.pages.dev/legal/tester-privacy/
        Sanctions (DRAFT): https://agent-bv.pages.dev/legal/tester-sanctions/
  - type: checkboxes
    id: attestation
    attributes:
      label: Sanctions and terms attestation
      options:
        - label: "I am not located in, ordinarily resident in, or organized in a jurisdiction subject to comprehensive U.S. sanctions, and I am not on, or owned or controlled by anyone on, a U.S. sanctions list, including OFAC's SDN List. I agree to the Tester Terms and Privacy Notice: https://agent-bv.pages.dev/legal/tester-terms/ and https://agent-bv.pages.dev/legal/tester-privacy/."
          required: true
